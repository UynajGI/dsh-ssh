name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  pack:
    name: publishable payload
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the publishable tarball carries the src tree
        run: |
          npm pack --dry-run
          test -n "$(npm pack --dry-run 2>/dev/null | grep 'src/runtime.ts')" \
            || { echo 'src tree missing from the publishable payload'; exit 1; }
